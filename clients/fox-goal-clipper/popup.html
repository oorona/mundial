<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fox Goal Clipper — activity</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 420px; max-height: 520px; margin: 0; padding: 10px 12px; color: #111; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .counts { font-size: 12px; color: #444; margin-bottom: 8px; }
    .counts b { color: #111; }
    .row { font-size: 12px; padding: 5px 6px; border-bottom: 1px solid #eee; line-height: 1.35; }
    .stage { display: inline-block; min-width: 64px; font-weight: 600; }
    .ok { color: #16a34a; } .no { color: #b45309; } .err { color: #dc2626; }
    .ts { color: #888; }
    .tid { color: #2563eb; }
    .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    button { font-size: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 5px; background: #fafafa; cursor: pointer; }
    a { font-size: 12px; color: #2563eb; }
    #empty { color: #888; font-size: 12px; padding: 10px 0; }
    #list { overflow-y: auto; max-height: 380px; }
  </style>
</head>
<body>
  <h1>Fox Goal Clipper — activity</h1>
  <div id="status" style="font-size:12px;padding:6px 8px;border-radius:6px;margin-bottom:8px;background:#f3f4f6;"></div>
  <div class="counts" id="counts"></div>
  <div class="bar">
    <button id="clear">Clear log</button>
    <a href="#" id="opts">Options</a>
  </div>
  <div id="list"></div>
  <div id="empty">No activity yet. Open the Fox profile on x.com.</div>
  <script src="popup.js"></script>
</body>
</html>
